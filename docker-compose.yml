version: '3.9'

services:
  # Redis local para desarrollo (en producción usar Redis Cloud)
  redis:
    image: redis:7-alpine
    container_name: sri-ant-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sri-ant-backend
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      redis:
        condition: service_healthy

  # Frontend React (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sri-ant-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: "http://localhost:8080/api"
    depends_on:
      - backend

volumes:
  redis-data:
